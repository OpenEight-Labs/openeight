framework = "langchain"
summary = "Exercise a scoped refund tool and exact-request authorization."
entry = ["langchain_agent.py"]
sample = ["sample.py"]
install = ".[test]"
requirements = "requirements-qualified.txt"
requires_model = true
integration = "managed"

[patterns.order-lookup]

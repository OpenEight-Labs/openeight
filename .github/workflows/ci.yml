name: Candidate checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.paths.outputs.python }}
      typescript: ${{ steps.paths.outputs.typescript }}
      cookbook: ${{ steps.paths.outputs.cookbook }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: paths
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/select_checks.py
        working-directory: ${{ github.workspace }}
  python:
    needs: select
    if: needs.select.outputs.python == 'true'
    runs-on: ubuntu-latest
    env:
      OPENEIGHT_COOKBOOK_ROOT: ${{ github.workspace }}/cookbook
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -c sdk/python/constraints/qualified.txt 'build==1.6.1' 'setuptools==84.1.0' 'wheel==0.48.0'
      - run: python -m build sdk/python --outdir "$RUNNER_TEMP/wheels"
      - run: python -m pip install -c sdk/python/constraints/qualified.txt "$RUNNER_TEMP"/wheels/*.whl 'deepagents==0.7.23' 'mcp==1.30.0' 'aiosqlite==0.22.1' 'langgraph-checkpoint-sqlite==3.1.2' 'pytest==9.1.1' 'pytest-asyncio==1.4.0' 'ruff==0.12.12' 'mypy==1.18.2'
      - run: python -I -c "import pathlib,sys,openeight; assert pathlib.Path(openeight.__file__).is_relative_to(pathlib.Path(sys.prefix))"
        working-directory: ${{ runner.temp }}
      - run: python scripts/assert_candidate.py "$RUNNER_TEMP"/wheels/*.whl
      - run: python -m ruff check sdk/python/openeight sdk/python/typing_tests
      - run: python -m mypy --config-file sdk/python/pyproject.toml sdk/python/typing_tests
      - run: python -m pytest sdk/python/tests -q
  typescript:
    needs: select
    if: needs.select.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci && npm run format:check && npm run typecheck && npm run build && npm test
        working-directory: sdk/typescript
      - name: Pack the tested TypeScript package
        id: package
        working-directory: sdk/typescript
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module -e 'import fs from "node:fs"; const [pkg] = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-pack.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${process.env.RUNNER_TEMP}/${pkg.filename}\n`);'
      - name: Installed Node package smoke
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          mkdir "$RUNNER_TEMP/node-customer"
          cd "$RUNNER_TEMP/node-customer"
          npm init -y
          npm install "$TARBALL"
          node --input-type=module -e 'import {MachineClient} from "@openeight/sdk"; if(typeof MachineClient !== "function") throw Error("missing export")'
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/check.py
  required:
    name: Candidate checks passed
    if: always()
    needs: [select, python, typescript, structural]
    runs-on: ubuntu-latest
    steps:
      - env:
          SELECT: ${{ needs.select.result }}
          PYTHON: ${{ needs.python.result }}
          TYPESCRIPT: ${{ needs.typescript.result }}
          STRUCTURAL: ${{ needs.structural.result }}
        run: |
          test "$SELECT" = success
          test "$STRUCTURAL" = success
          for result in "$PYTHON" "$TYPESCRIPT"; do
            test "$result" = success || test "$result" = skipped
          done

name: Cookbook qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: cookbook

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      cookbook: ${{ steps.paths.outputs.cookbook }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: paths
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/select_checks.py
        working-directory: ${{ github.workspace }}
  local:
    needs: select
    if: needs.select.outputs.cookbook == 'true'
    name: Local samples and launcher (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Lint cookbook source and tests
        if: matrix.python == '3.12'
        run: |
          python -m pip install 'ruff==0.12.12'
          python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s patterns/order-lookup/tests -v

  refund-business:
    needs: select
    if: needs.select.outputs.cookbook == 'true'
    name: Refund amounts, request ownership and native schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'langchain-core==1.6.7' 'pydantic==2.14.2' 'pytest>=8,<10'
      - run: python -m pytest patterns/governed-refund/tests/test_business.py -q

  native-agent:
    needs: select
    if: needs.select.outputs.cookbook == 'true'
    name: Existing LangChain agent without OpenEight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r patterns/governed-refund/requirements-native.txt 'pytest>=8,<10'
      - run: python -c "import importlib.util; assert importlib.util.find_spec('openeight') is None"
      - run: python patterns/governed-refund/native_agent.py --help
      - run: python -m pytest patterns/governed-refund/tests/test_native.py -q

  managed:
    needs: select
    if: needs.select.outputs.cookbook == 'true'
    name: Offline SDK integration (${{ matrix.recipe }})
    env:
      COOKBOOK_REQUIRE_SDK: "1"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        recipe: [customer-support, incident-response, governed-refund, order-lookup]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install build
          python -m build ../sdk/python --outdir "$RUNNER_TEMP/wheels"
          python ../scripts/candidate_constraint.py
      - name: Prepare recipe installer
        env:
          RECIPE: ${{ matrix.recipe }}
        run: |
          case "$RECIPE" in customer-support|incident-response) path="agents/$RECIPE" ;; *) path="patterns/$RECIPE" ;; esac
          python -m venv "$path/.venv"
          "$path/.venv/bin/python" -m pip install 'pip==26.3'
      - run: python cookbook.py setup ${{ matrix.recipe }}
      - name: Verify exact installed SDK artifact
        env:
          RECIPE: ${{ matrix.recipe }}
        run: |
          case "$RECIPE" in customer-support|incident-response) path="agents/$RECIPE" ;; *) path="patterns/$RECIPE" ;; esac
          "$path/.venv/bin/python" ../scripts/assert_candidate.py "$RUNNER_TEMP"/wheels/*.whl
      - run: python cookbook.py test ${{ matrix.recipe }} -- -q
      - name: Optional refund framework comparison
        if: matrix.recipe == 'governed-refund'
        run: |
          patterns/governed-refund/.venv/bin/python -m pip install -e 'patterns/governed-refund[deepagents,test]'
          python cookbook.py test governed-refund -- -q

  package:
    needs: select
    if: needs.select.outputs.cookbook == 'true'
    name: Package ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - recipe: governed-refund
            path: patterns/governed-refund
          - recipe: customer-support
            path: agents/customer-support
          - recipe: incident-response
            path: agents/incident-response
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'pip==26.3' 'build==1.6.1'
      - run: |
          python -m build ../sdk/python --outdir "$RUNNER_TEMP/wheels"
          python ../scripts/candidate_constraint.py
          python -m build ${{ matrix.path }}
      - name: Verify installed Customer Support CLI
        if: matrix.recipe == 'customer-support'
        run: |
          python -m pip install agents/customer-support/dist/*.whl
          cd "$RUNNER_TEMP"
          customer-support --help
      - name: Verify installed Incident Response CLI
        if: matrix.recipe == 'incident-response'
        run: |
          python -m pip install agents/incident-response/dist/*.whl
          cd "$RUNNER_TEMP"
          incident-agent --help

  otel:
    needs: select
    if: needs.select.outputs.cookbook == 'true'
    name: OTEL observation pattern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r patterns/otel-observation/requirements.txt
      - run: python -c "import importlib.util; assert importlib.util.find_spec('openeight') is None"
      - run: python patterns/otel-observation/agent.py --help
      - run: python -m unittest discover -s patterns/otel-observation/tests -v
  required:
    name: Cookbook qualification passed
    if: always()
    needs: [select, local, refund-business, native-agent, managed, package, otel]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          case "$RESULTS" in *failure*|*cancelled*) exit 1 ;; esac

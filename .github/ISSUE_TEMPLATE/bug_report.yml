name: Bug report
description: Report unexpected SDK or cookbook behavior.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, follow [SECURITY.md](https://github.com/OpenEight-Labs/openeight/blob/main/SECURITY.md) instead of posting here.
        Use synthetic data. Remove credentials, private endpoints, customer content and runtime state.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Python SDK
        - TypeScript SDK
        - Cookbook
        - Documentation or tooling
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: Package version or source revision, Python/Node version, OS, and relevant framework versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide commands or a small synthetic example, including the recipe name if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include safe error codes or sanitized output. Review attachments for private data.
    validations:
      required: true
